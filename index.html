<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>食物翻翻乐</title>
<style>
/* =========================================================
   日系简洁风 · 和色配色（墨 / 生成り / 桜 / 若竹 / 砂）
   要点：大留白 · 发丝级细线 · 明朝体标题 · 宽字距 · 无重阴影
   ========================================================= */
:root{
  --bg:#F6F4F1;        /* 生成り（本白） */
  --paper:#FFFFFF;     /* 胡粉 */
  --ink:#3C3A36;       /* 墨 */
  --sub:#948E85;       /* 灰白茶 */
  --line:#E6E2DB;      /* 发丝线 */
  --matcha:#A3B79C;    /* 若竹 */
  --sakura:#E2AFA3;    /* 桜 */
  --sand:#D6B69B;      /* 砂 */
  --serif:"Songti SC","STSong","Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-weight:400;letter-spacing:.02em;line-height:1.75;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;justify-content:center;
}
#app{width:100%;max-width:460px;min-height:100vh;padding:8px 22px calc(28px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.active{display:block;animation:pageIn .5s cubic-bezier(.22,.61,.36,1) both}

/* ---------- 通用排版件 ---------- */
.kicker{font-size:9px;letter-spacing:.42em;color:var(--sub);text-transform:uppercase}
.divider{display:flex;align-items:center;gap:7px;width:104px;margin:16px auto}
.divider span{flex:1;height:1px;background:var(--line)}
.divider i{width:3px;height:3px;border-radius:50%;background:#CFC9C0;display:block}
.foot{font-size:10px;letter-spacing:.14em;color:#B4AEA5;text-align:center;margin-top:22px}

/* ---------- 按钮 ---------- */
button{
  font-family:var(--sans);border:none;cursor:pointer;color:#fff;background:var(--ink);
  border-radius:9px;padding:14px 28px;font-size:13px;letter-spacing:.18em;
  transition:transform .18s ease,opacity .18s ease;
}
button:active{transform:translateY(1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:active{background:#F0EDE8}
.actions{display:flex;gap:10px;justify-content:center;margin-top:22px}

/* ---------- 幕1 · 首页 ---------- */
.hero{padding-top:34px;text-align:center}
.hero .kicker{margin-bottom:20px}
.hero-art{width:92px;margin:0 auto}
.hero-art svg{width:100%;height:auto;display:block}
h1{
  font-family:var(--serif);font-size:27px;font-weight:400;
  letter-spacing:.26em;text-indent:.26em;margin-top:12px;
}
.lead{font-size:12.5px;color:var(--sub);letter-spacing:.06em;margin-top:2px}
#lvls{margin-top:30px}
.lvl{
  display:flex;align-items:center;gap:14px;background:var(--paper);
  border:1px solid var(--line);border-radius:13px;padding:17px 18px;margin-bottom:10px;
  cursor:pointer;transition:border-color .25s ease,transform .18s ease,box-shadow .25s ease;
}
.lvl:hover{border-color:#D2CCc3;box-shadow:0 4px 16px rgba(60,58,54,.05)}
.lvl:active{transform:scale(.985)}
.lvl .no{font-family:var(--serif);font-size:12px;color:#C3BDB4;letter-spacing:.1em}
.lvl .txt{flex:1;text-align:left}
.lvl h3{font-size:15px;font-weight:500;letter-spacing:.1em}
.lvl .desc{font-size:11px;color:var(--sub);letter-spacing:.04em;margin-top:2px}
.lvl .best{font-size:10.5px;color:var(--matcha);letter-spacing:.06em;margin-top:5px}
.lvl .arw{font-size:15px;color:#CFC9C0}

/* ---------- 幕2 · 游戏 ---------- */
#topbar{
  position:sticky;top:0;z-index:9;background:rgba(246,244,241,.94);
  -webkit-backdrop-filter:saturate(160%) blur(8px);backdrop-filter:saturate(160%) blur(8px);
  display:flex;padding:14px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line);
}
#topbar .st{flex:1;text-align:center;position:relative}
#topbar .st + .st::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
#topbar .k{display:block;font-size:8.5px;letter-spacing:.3em;color:var(--sub)}
#topbar .v{display:block;font-family:var(--serif);font-size:19px;letter-spacing:.06em;margin-top:1px}
#topbar .snd{
  flex:0 0 30px;width:30px;height:30px;padding:0;margin:4px 0 0;background:transparent;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
}
#topbar .snd:active{background:#EFECE6;transform:none}
#topbar .snd svg{width:17px;height:17px;display:block}

#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:16px}
.card{aspect-ratio:3/4;perspective:800px;cursor:pointer}
.card .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.05,.2,1)}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:11px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;
}
.cover{
  background:#F1EEE9;
  background-image:repeating-linear-gradient(45deg,rgba(60,58,54,.014) 0 5px,transparent 5px 10px);
}
.cover svg{width:52%;height:auto;display:block}
.foodf{background:var(--paper);transform:rotateY(180deg);padding:5px;transition:background .3s,border-color .3s}
.foodf svg{width:66%;height:auto;display:block}
.foodf .fname{font-family:var(--serif);font-size:9.5px;color:var(--sub);letter-spacing:.1em}
.card.done{cursor:default;animation:matched .45s ease both}
.card.done .foodf{background:#F6F8F3;border-color:#C9D7C1}
.card.done{opacity:.74}

/* ---------- 幕3 · 结算 ---------- */
.win-card{
  background:var(--paper);border:1px solid var(--line);border-radius:15px;
  padding:30px 22px 26px;margin-top:28px;text-align:center;
  box-shadow:0 8px 28px rgba(60,58,54,.055);
}
.win-card h2{font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:.22em;text-indent:.22em;margin-top:9px}
#stars{display:flex;justify-content:center;gap:7px;margin-top:16px}
.star{width:34px;height:34px;display:block}
.win-card .stat{font-size:12.5px;color:var(--sub);letter-spacing:.06em}
.win-card .rec{font-size:11px;color:var(--matcha);letter-spacing:.06em;margin-top:7px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;margin-top:14px}
.panel-h{font-size:10px;letter-spacing:.26em;color:var(--sub);text-align:center;margin-bottom:14px}
#parade{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#parade .pf{width:58px;text-align:center}
#parade .box{border:1px solid var(--line);border-radius:11px;background:#FCFAF6;padding:7px 0 5px}
#parade .box svg{width:34px;height:34px;display:block;margin:0 auto}
#parade .nm{font-size:9.5px;color:var(--sub);letter-spacing:.08em;margin-top:5px}

/* ---------- 吐司提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
  background:rgba(255,255,255,.97);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:11px 20px;
  font-size:12.5px;letter-spacing:.06em;max-width:84vw;text-align:center;
  box-shadow:0 6px 24px rgba(60,58,54,.09);
  pointer-events:none;opacity:0;z-index:99;
}
#toast.show{animation:toastUp 2.1s cubic-bezier(.22,.61,.36,1) both}

/* ---------- 动画 ---------- */
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dealIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes matched{0%{transform:scale(1)}42%{transform:scale(1.055)}100%{transform:scale(1)}}
@keyframes toastUp{
  0%{opacity:0;transform:translate(-50%,12px)}
  10%{opacity:1;transform:translate(-50%,0)}
  82%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-12px)}
}
.deal{animation:dealIn .42s cubic-bezier(.22,.61,.36,1) both}
</style>
</head>
<body>
<div id="app">

  <!-- 幕1 · 首页 -->
  <section id="s-home" class="screen active">
    <div class="hero">
      <div class="kicker">Itadakimasu</div>
      <div class="hero-art" id="homeArt"></div>
      <h1>食物翻翻乐</h1>
      <div class="divider"><span></span><i></i><span></span></div>
      <p class="lead">翻开两张相同的食物，凑成一对<br>全部配完，看看你记住了几道菜</p>
    </div>
    <div id="lvls"></div>
    <p class="foot">插画取自《吃饭日记》手绘素材库</p>
  </section>

  <!-- 幕2 · 游戏 -->
  <section id="s-game" class="screen">
    <div id="topbar">
      <div class="st"><span class="k">STEPS</span><span class="v" id="stMoves">0</span></div>
      <div class="st"><span class="k">PAIRS</span><span class="v" id="stPairs">0/0</span></div>
      <div class="st"><span class="k">TIME</span><span class="v" id="stTime">0s</span></div>
      <button class="snd" id="btnSnd" aria-label="音效开关"></button>
    </div>
    <div id="grid"></div>
    <div class="actions"><button class="btn-ghost" id="btnQuit">回到首页</button></div>
  </section>

  <!-- 幕3 · 结算 -->
  <section id="s-win" class="screen">
    <div class="win-card">
      <div class="kicker">Gochisousama</div>
      <h2 id="winTitle"></h2>
      <div id="stars"></div>
      <div class="divider"><span></span><i></i><span></span></div>
      <p class="stat" id="winStats"></p>
      <p class="rec" id="winBest"></p>
    </div>
    <div class="panel">
      <div class="panel-h">这一局翻出的菜</div>
      <div id="parade"></div>
    </div>
    <div class="actions">
      <button id="btnAgain">再来一局</button>
      <button class="btn-ghost" id="btnHome">换个难度</button>
    </div>
  </section>

</div>
<div id="toast"></div>
<script>
/* =====================================================
   食物翻翻乐 —— 记忆翻牌配对（图鉴第5类·轻度）
   翻两张 → 一样就收走，不一样就盖回去；全配对即过关。
   插画复用《吃饭日记》手绘素材库，纯本地无后端。
   ===================================================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

/* ---------- 和色调色：把暖色手绘降饱和 + 描边收细，贴合日系简洁 ---------- */
const TONE={
  '#5B4234':'#4A453F',  /* 墨（描边，保持不变） */
  '#FFFCF5':'#FCFAF6',  /* 胡粉 */
  '#FFF3E2':'#F8F1E4',  /* 白茶 */
  '#F7D9A0':'#EFD9AE',  /* 砂 */
  '#E8A15D':'#DDAE88',  /* 淡香 */
  '#C88A5A':'#C39C82',  /* 灰白茶 */
  '#9CBF8A':'#8AC083',  /* 若竹 */
  '#F0997B':'#E8A796',  /* 桜 */
  '#E24B4A':'#D0685A',  /* 朱 */
  '#FFFDF8':'#FDFBF6'
};
function tone(s){
  let o=s;
  for(const k in TONE) o=o.split(k).join(TONE[k]);
  /* 描边收细 18%，线条更纤细 */
  return o.replace(/stroke-width="([\d.]+)"/g,(m,v)=>'stroke-width="'+(Math.round(parseFloat(v)*0.82*10)/10)+'"');
}
function fsvg(inner){return '<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">'+tone(inner)+'</svg>';}

/* ---------- 手绘食物插画（摘自吃饭日记素材库，60x60） ---------- */
const BOWL='<path d="M9 32 Q30 55 51 32 Z" fill="#FFFCF5" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 32 L51 32" stroke="#5B4234" stroke-width="2.2" stroke-linecap="round"/>';
const ART={
'米饭':BOWL+'<path d="M14 31 Q30 14 46 31 Z" fill="#FFFCF5" stroke="#5B4234" stroke-width="2"/><circle cx="24" cy="26" r="1.6" fill="#E8A15D"/><circle cx="34" cy="24" r="1.6" fill="#E8A15D"/>',
'饺子':'<path d="M8 34 Q16 16 30 18 Q44 20 52 34 Q30 40 8 34 Z" fill="#FFF3E2" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 32 q4 -6 8 0 q4 -6 8 0 q4 -6 8 0" fill="none" stroke="#C88A5A" stroke-width="1.8"/>',
'火锅':'<path d="M10 28 L50 28 Q48 46 30 46 Q12 46 10 28 Z" fill="#E8A15D" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 28 L52 28" stroke="#5B4234" stroke-width="2.6" stroke-linecap="round"/><path d="M20 24 q3 -5 6 0" fill="none" stroke="#C88A5A" stroke-width="2"/><path d="M34 24 q3 -5 6 0" fill="none" stroke="#C88A5A" stroke-width="2"/><circle cx="26" cy="34" r="2.4" fill="#9CBF8A"/><circle cx="36" cy="36" r="2.4" fill="#F0997B"/>',
'炸鸡':'<path d="M34 14 q12 4 10 18 q-2 14 -14 14 q-8 0 -10 -8 q-2 -8 4 -12 Z" fill="#E8A15D" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M18 40 L12 50" stroke="#5B4234" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="52" r="3" fill="#FFF3E2" stroke="#5B4234" stroke-width="2"/>',
'汉堡':'<path d="M12 26 Q30 12 48 26 Z" fill="#E8A15D" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><rect x="11" y="28" width="38" height="6" rx="3" fill="#9CBF8A" stroke="#5B4234" stroke-width="2"/><rect x="12" y="35" width="36" height="7" rx="3" fill="#C88A5A" stroke="#5B4234" stroke-width="2"/><path d="M12 43 Q30 50 48 43 Z" fill="#F7D9A0" stroke="#5B4234" stroke-width="2.2"/>',
'寿司':'<rect x="12" y="28" width="36" height="16" rx="7" fill="#FFFCF5" stroke="#5B4234" stroke-width="2.2"/><path d="M12 32 Q30 22 48 32 Q30 36 12 32 Z" fill="#F0997B" stroke="#5B4234" stroke-width="2"/><rect x="26" y="26" width="8" height="20" fill="#5B4234" opacity=".85"/>',
'奶茶':'<path d="M20 18 L40 18 L37 48 Q30 52 23 48 Z" fill="#FFF3E2" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M22 30 L38 30 L37 46 Q30 49 23 46 Z" fill="#C88A5A"/><path d="M34 12 L30 22" stroke="#5B4234" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="42" r="2" fill="#5B4234"/><circle cx="34" cy="44" r="2" fill="#5B4234"/>',
'蛋糕':'<rect x="14" y="30" width="32" height="16" rx="4" fill="#F7D9A0" stroke="#5B4234" stroke-width="2.2"/><path d="M14 30 q6 -8 10 0 q4 -8 10 0 q4 -8 10 0" fill="none" stroke="#FFFDF8" stroke-width="4"/><path d="M30 22 L30 16" stroke="#5B4234" stroke-width="2.2" stroke-linecap="round"/><circle cx="30" cy="13" r="3.4" fill="#E24B4A"/>',
'西瓜':'<path d="M10 40 Q30 12 50 40 Z" fill="#F0997B" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 40 Q30 22 46 40" fill="none" stroke="#9CBF8A" stroke-width="3"/><circle cx="26" cy="32" r="1.8" fill="#5B4234"/><circle cx="34" cy="32" r="1.8" fill="#5B4234"/>',
'冰淇淋':'<path d="M18 30 L42 30 L30 52 Z" fill="#E8A15D" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M20 30 q4 -10 10 -6 q6 -6 10 6 Z" fill="#FFF3E2" stroke="#5B4234" stroke-width="2.2"/><circle cx="27" cy="24" r="5" fill="#F0997B" stroke="#5B4234" stroke-width="2"/><circle cx="35" cy="25" r="4.4" fill="#F7D9A0" stroke="#5B4234" stroke-width="2"/>',
};
/* 牌背：盖着的菜 + 冒热气（留白更多，线条更细） */
const COVER_ART=fsvg('<path d="M13 36 Q30 17 47 36 Z" fill="#F7D9A0" stroke="#C88A5A" stroke-width="2" stroke-linejoin="round"/><path d="M8 36 L52 36" stroke="#C88A5A" stroke-width="2.2" stroke-linecap="round"/><circle cx="30" cy="12" r="2.6" fill="#E8A15D" stroke="#C88A5A" stroke-width="1.6"/><path d="M24 45 q2.5 -3.5 0 -7" fill="none" stroke="#C88A5A" stroke-width="1.6" stroke-linecap="round"/><path d="M36 45 q2.5 -3.5 0 -7" fill="none" stroke="#C88A5A" stroke-width="1.6" stroke-linecap="round"/>');
/* 首页大插画：一碗饭加一双筷子 */
const HOME_ART=fsvg('<ellipse cx="30" cy="55" rx="19" ry="2.2" fill="#F7D9A0"/>'+BOWL+'<path d="M14 31 Q30 14 46 31 Z" fill="#FFFCF5" stroke="#5B4234" stroke-width="2"/><circle cx="24" cy="26" r="1.6" fill="#E8A15D"/><circle cx="34" cy="24" r="1.6" fill="#E8A15D"/><path d="M41 9 L50 25 M46 7 L54 21" stroke="#C88A5A" stroke-width="2.2" stroke-linecap="round"/>');
/* 星星（评分用，细线樱色 / 空星灰） */
function starSVG(filled){
  return '<svg class="star" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">'
    +'<path d="M24 7.5 l5.1 11.4 12.4 1.1 -9.4 8.4 2.7 12.3 -10.8-6.3 -10.8 6.3 2.7-12.3 -9.4-8.4 12.4-1.1 Z"'
    +' fill="'+(filled?'#EAC9C2':'#F2EFEA')+'" stroke="'+(filled?'#D3A79E':'#DED9D2')+'" stroke-width="1.3" stroke-linejoin="round"/></svg>';
}

/* ---------- 食物小知识（配对成功时冒出来一句） ---------- */
const KCAL={'米饭':200,'饺子':400,'火锅':800,'炸鸡':600,'汉堡':550,'寿司':500,'奶茶':400,'蛋糕':350,'西瓜':100,'冰淇淋':250};
const NOTES={
'米饭':'白米饭的搭子是十分钟的午睡',
'饺子':'一张皮包住一整个下午的想念',
'火锅':'冬天和火锅是官方认证的一对',
'炸鸡':'酥脆的声音就是快乐的音效',
'汉堡':'一口下去，蔬菜和肉握手言和',
'寿司':'米饭卷起海苔，也卷走了烦恼',
'奶茶':'珍珠要慢慢嚼，日子要慢慢过',
'蛋糕':'甜一点，再甜一点也没关系',
'西瓜':'夏天的瓜，最好吃的是这一牙',
'冰淇淋':'趁着没化，先吃为敬',
};

/* ---------- 难度（对数 → 网格规模） ---------- */
const LEVELS=[
 {n:'小食分量',pairs:6,desc:'12 张 · 4×3　热身局'},
 {n:'正常饭量',pairs:8,desc:'16 张 · 4×4　标准局'},
 {n:'大胃王',pairs:10,desc:'20 张 · 4×5　记性挑战'},
];
const FOOD_KEYS=Object.keys(ART); // 10 种，恰好够大胃王

/* ---------- 全局状态 ---------- */
let G={pairs:6,deck:[],open:[],lock:false,moves:0,found:0,t0:0,timer:null,matchedKeys:[]};

/* =====================================================
   音效：Web Audio 现场合成（不引入任何音频文件，单文件依旧自足）
   翻对 = 律音阶上行，清脆如风铃；翻错 = 低音下滑闷响，如鹿威敲竹筒。
   ===================================================== */
const SND_KEY='foodpairs_snd_v1';
let AC=null, sndOn=true;
try{sndOn=localStorage.getItem(SND_KEY)!=='0'}catch(e){}

function actx(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    AC=new C();
  }
  if(AC.state==='suspended')AC.resume();   // 浏览器自动播放策略：必须在手势里唤醒
  return AC;
}
/* 一声：波形 + 频率（可滑音）+ 时长 + 音量 + 延迟；快起快落的木琴式包络 */
function beep(o){
  const c=actx();if(!c)return;
  const t=c.currentTime+(o.at||0);
  const osc=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(o.v||.16,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  lp.type='lowpass';lp.frequency.value=o.lp||3600;   // 削掉高频毛刺，音色更柔
  osc.connect(g);g.connect(lp);lp.connect(c.destination);
  osc.start(t);osc.stop(t+o.d+.03);
}
/* 翻对：D5 → A5 → D6，上行两音加一记高八度余韵 */
function sfxMatch(){
  if(!sndOn)return;
  beep({f:587.33,d:.17,v:.15,type:'triangle',lp:4400,at:.02});
  beep({f:880.00,d:.24,v:.115,type:'triangle',lp:4400,at:.10});
  beep({f:1174.66,d:.34,v:.055,type:'sine',lp:6000,at:.18});
}
/* 翻错：G3 滑到 F3，再补一记更低的 D3，短促不刺耳 */
function sfxMiss(){
  if(!sndOn)return;
  beep({f:196.00,f2:174.61,d:.22,v:.13,type:'sine',lp:820,at:.02});
  beep({f:146.83,d:.15,v:.055,type:'sine',lp:560,at:.07});
}
function sndIcon(on){
  const c=on?'#948E85':'#C3BDB4';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">'
    +'<path d="M4 9.4h3.3L12 5.6v12.8L7.3 14.6H4z"/>'
    +(on?'<path d="M15.8 9.3a3.9 3.9 0 0 1 0 5.4"/><path d="M18.4 6.9a7.3 7.3 0 0 1 0 10.2"/>'
        :'<path d="M16.2 9.6l5 4.8"/><path d="M21.2 9.6l-5 4.8"/>')
    +'</svg>';
}
function paintSnd(){$('#btnSnd').innerHTML=sndIcon(sndOn);}

/* ---------- 洗牌（Fisher-Yates，保证每种恰好两张） ---------- */
function buildDeck(pairs){
  const keys=FOOD_KEYS.slice(0,pairs);
  const deck=[...keys,...keys];
  for(let i=deck.length-1;i>0;i--){const j=rnd(0,i);[deck[i],deck[j]]=[deck[j],deck[i]];}
  return deck;
}

/* ---------- 画面切换 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
}

/* ---------- 首页：难度卡 + 最佳纪录 ---------- */
const BEST_KEY='foodpairs_best_v1';
function loadBest(){try{return JSON.parse(localStorage.getItem(BEST_KEY))||{}}catch(e){return{}}}
function renderHome(){
  $('#homeArt').innerHTML=HOME_ART;
  const best=loadBest(),box=$('#lvls');box.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const d=document.createElement('div');
    d.className='lvl';
    const b=best[lv.pairs];
    d.innerHTML='<span class="no">0'+(i+1)+'</span>'
      +'<div class="txt"><h3>'+lv.n+'　<span style="font-size:11px;color:var(--sub);letter-spacing:.08em">'+lv.pairs+' 对</span></h3>'
      +'<p class="desc">'+lv.desc+'</p>'
      +(b?'<p class="best">最佳　'+b.moves+' 步 · '+b.time+' 秒</p>':'<p class="best" style="color:#C3BDB4">还没有这一档的纪录</p>')
      +'</div><span class="arw">›</span>';
    d.onclick=()=>startGame(lv.pairs);
    box.appendChild(d);
  });
}

/* ---------- 开局 ---------- */
function startGame(pairs){
  G={pairs,deck:buildDeck(pairs),open:[],lock:false,moves:0,found:0,
     t0:Date.now(),timer:null,matchedKeys:[]};
  $('#stMoves').textContent='0';
  $('#stPairs').textContent='0/'+pairs;
  $('#stTime').textContent='0s';
  const grid=$('#grid');grid.innerHTML='';
  G.deck.forEach((key,idx)=>{
    const c=document.createElement('div');
    c.className='card deal';
    c.style.animationDelay=(idx*30)+'ms';   // 逐张入场
    c.dataset.key=key;
    c.innerHTML='<div class="inner">'
      +'<div class="face cover">'+COVER_ART+'</div>'
      +'<div class="face foodf">'+fsvg(ART[key])+'<span class="fname">'+key+'</span></div>'
      +'</div>';
    c.onclick=()=>flip(c);
    grid.appendChild(c);
  });
  G.timer=setInterval(()=>{
    const s=Math.floor((Date.now()-G.t0)/1000);
    $('#stTime').textContent=s+'s';
  },1000);
  show('s-game');
}

/* ---------- 翻牌核心逻辑 ---------- */
function flip(card){
  if(G.lock)return;
  if(card.classList.contains('open')||card.classList.contains('done'))return;
  card.classList.add('open');
  G.open.push(card);
  if(G.open.length<2)return;
  G.moves++;$('#stMoves').textContent=G.moves;
  const [a,b]=G.open;
  if(a.dataset.key===b.dataset.key){
    /* 配对成功：收走 + 冒一句食物小知识 */
    a.classList.add('done');b.classList.add('done');
    a.classList.remove('open');b.classList.remove('open');
    G.found++;G.matchedKeys.push(a.dataset.key);
    $('#stPairs').textContent=G.found+'/'+G.pairs;
    toast(a.dataset.key+'　'+NOTES[a.dataset.key]);
    sfxMatch();                       /* 翻对：上行清脆音 */
    G.open=[];
    if(G.found===G.pairs)setTimeout(winGame,650);
  }else{
    /* 没配上：锁 0.75 秒后盖回去 */
    sfxMiss();                        /* 翻错：低沉闷响 */
    G.lock=true;
    setTimeout(()=>{
      a.classList.remove('open');b.classList.remove('open');
      G.open=[];G.lock=false;
    },750);
  }
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;
  t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
}

/* ---------- 过关结算 ---------- */
function winGame(){
  clearInterval(G.timer);
  const sec=Math.floor((Date.now()-G.t0)/1000);
  /* 评星：越接近理论最少步数（对数）越高 */
  const perfect=G.pairs;
  let stars=1;
  if(G.moves<=Math.ceil(perfect*1.5))stars=3;
  else if(G.moves<=Math.ceil(perfect*2.3))stars=2;
  const T2=['','干饭记忆力在线','好记性','最强大胃王'];
  $('#winTitle').textContent=T2[stars];
  $('#stars').innerHTML=starSVG(stars>=1)+starSVG(stars>=2)+starSVG(stars>=3);
  $('#winStats').textContent=G.pairs+' 对 · '+G.moves+' 步 · 用时 '+sec+' 秒';
  /* 最佳纪录（按难度存最少步） */
  const best=loadBest();let bestMsg='这是这一档的第一个纪录';
  const old=best[G.pairs];
  if(!old||G.moves<old.moves||(G.moves===old.moves&&sec<old.time)){
    best[G.pairs]={moves:G.moves,time:sec};
    try{localStorage.setItem(BEST_KEY,JSON.stringify(best))}catch(e){}
    bestMsg='新纪录　'+G.moves+' 步 · '+sec+' 秒';
  }else{
    bestMsg='最佳仍是 '+old.moves+' 步 · '+old.time+' 秒，差一点点';
  }
  $('#winBest').textContent=bestMsg;
  /* 美食巡游：这一局配到的全部食物 */
  $('#parade').innerHTML=G.matchedKeys.map(k=>'<div class="pf"><div class="box">'+fsvg(ART[k])+'</div><div class="nm">'+k+'</div></div>').join('');
  show('s-win');
}

/* ---------- 按钮接线 ---------- */
$('#btnSnd').onclick=()=>{
  sndOn=!sndOn;
  try{localStorage.setItem(SND_KEY,sndOn?'1':'0')}catch(e){}
  paintSnd();
  if(sndOn)sfxMatch();               /* 打开时先响一声，确认音量正常 */
};
$('#btnQuit').onclick=()=>{clearInterval(G.timer);renderHome();show('s-home');};
$('#btnAgain').onclick=()=>startGame(G.pairs);
$('#btnHome').onclick=()=>{renderHome();show('s-home');};
paintSnd();
renderHome();
</script>
