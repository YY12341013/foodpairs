<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>吃饭日记</title>
<style>
/* ===== 基础与配色 ===== */
:root{
  --cream:#FFF6E9;      /* 奶油白 打底 */
  --caramel:#E8A15D;    /* 焦糖橙 主色 */
  --milk:#C88A5A;       /* 奶茶棕 辅色 */
  --butter:#F7D9A0;     /* 奶油黄 辅色 */
  --ink:#5B4234;        /* 深棕 文字 */
  --matcha:#9CBF8A;     /* 抹茶绿 点缀 */
  --paper:#FFFCF5;      /* 纸张白 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.7;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;}
img{display:block;max-width:100%;}
/* 纸张质感：内联 SVG 噪点，不联网 */
.paper-texture{
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
}
.radius-organ{border-radius:20px 26px 22px 28px/26px 20px 28px 22px;}

/* ===== 第 1 幕 开场页 ===== */
#intro{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 36px;background:var(--cream);
  transition:opacity .5s ease;
}
#intro .type{
  font-size:23px;line-height:2;font-weight:500;text-align:center;
  min-height:6em;letter-spacing:1px;
}
#intro .type b{color:var(--caramel);font-weight:500;}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--caramel);vertical-align:-2px;animation:blink .9s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}
#intro .skiphint{margin-top:28px;font-size:13px;color:var(--milk);opacity:.85;}
#intro .deco{margin-bottom:26px;}
#intro.out{opacity:0;pointer-events:none;}

/* ===== 第 2 幕 插画过渡 ===== */
#trans{
  position:absolute;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;background:var(--cream);
}
#trans.show{display:flex;animation:pushIn 1.2s ease forwards;}
@keyframes pushIn{
  0%{transform:scale(1);opacity:1}
  70%{transform:scale(1.06);opacity:1}
  100%{transform:scale(1.35);opacity:0}
}
#walker{width:200px;height:200px;animation:walkIn 1.2s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes walkIn{from{transform:translateX(-190px)}to{transform:translateX(0)}}
#legA{animation:legA .32s ease-in-out infinite alternate;transform-origin:100px 122px;}
#legB{animation:legB .32s ease-in-out infinite alternate;transform-origin:100px 122px;}
@keyframes legA{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
@keyframes legB{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.steam{animation:steam 1.4s ease-in-out infinite;}
@keyframes steam{0%{opacity:.2;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-3px)}100%{opacity:.2;transform:translateY(2px)}}

/* ===== 第 3 幕 主页面 ===== */
#app{position:absolute;inset:0;display:none;flex-direction:column;}
#app.show{display:flex;}
#topbar{
  flex:none;padding:14px 18px 10px;background:var(--cream);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px dashed rgba(200,138,90,.35);
}
#topbar .brand{font-size:17px;font-weight:500;}
#topbar .date{font-size:12px;color:var(--milk);}
#backToday{
  display:none;font-size:12px;padding:5px 12px;border-radius:999px;
  background:var(--butter);color:var(--ink);
}
#backToday.on{display:inline-block;}
#papers{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px 120px;
  display:flex;flex-direction:column;gap:14px;align-items:center;
}
/* 打印机出纸动画 */
.paper{
  width:100%;max-width:460px;padding:20px 20px 18px;
  border:2px solid var(--milk);
  border-radius:20px 26px 22px 28px/26px 20px 28px 22px;
  animation:feed .62s cubic-bezier(.16,.9,.3,1) both;
}
@keyframes feed{
  0%{opacity:0;transform:translateY(120px) rotate(2.5deg) scale(.96);}
  55%{opacity:1;transform:translateY(-10px) rotate(-.6deg) scale(1.01);}
  100%{opacity:1;transform:translateY(0) rotate(0) scale(1);}
}
.paper:nth-child(odd){transform:rotate(-.5deg);}
.paper:nth-child(even){transform:rotate(.4deg);}
.p-title{
  font-size:17px;font-weight:500;margin-bottom:12px;outline:none;
  border-bottom:2px dotted rgba(200,138,90,.4);padding-bottom:8px;
}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap;}
.label{
  flex:none;font-size:13px;color:var(--milk);
  background:#FDF1E0;padding:2px 9px;border-radius:999px;
}
.field{
  flex:1;min-width:90px;outline:none;padding:3px 6px;
  border-bottom:1.5px dashed rgba(200,138,90,.45);
  min-height:1.7em;
}
.field:focus{background:#FFF3E2;border-radius:6px;}
.field.num{flex:none;min-width:62px;text-align:center;color:var(--caramel);font-weight:500;}
.unit{font-size:12px;color:var(--milk);}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:rgba(200,138,90,.6);}
.hint{font-size:11.5px;color:var(--matcha);margin-top:6px;}
.picker{display:flex;gap:6px;flex-wrap:wrap;}
.picker button{
  width:42px;height:42px;border-radius:14px;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;background:#FDF1E0;
  transition:transform .15s ease;
}
.picker button svg{width:30px;height:30px;}
.picker button.on{border-color:var(--caramel);background:#FFE9CE;transform:translateY(-2px);}

/* 照片纸 */
.slot{
  width:100%;border:2px dashed rgba(200,138,90,.5);border-radius:18px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--milk);font-size:13px;padding:14px;
}
.slot.filled{border:2px solid var(--milk);padding:8px;background:#FFFDF8;}
.slot img{width:100%;border-radius:14px;}
.photo-frame{
  padding:7px;background:var(--paper);border:2px solid var(--milk);
  border-radius:18px 22px 18px 22px/22px 18px 22px 18px;
}
.sticker-wrap{padding:6px;}
.sticker-wrap img{max-height:220px;margin:0 auto;}
.slotbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.slotbtns button{
  flex:1;min-width:110px;padding:9px 10px;font-size:13px;
  border:2px solid var(--milk);border-radius:999px;background:var(--paper);
}
.slotbtns button.primary{background:var(--caramel);border-color:var(--caramel);color:#fff;}
.feeling{
  outline:none;min-height:120px;font-size:15.5px;line-height:1.9;
  padding:8px 4px;border-left:3px dotted rgba(200,138,90,.4);padding-left:12px;
}
.del{
  float:right;font-size:12px;color:var(--milk);padding:2px 8px;
  border:1.5px solid rgba(200,138,90,.5);border-radius:999px;margin-left:8px;
}

/* ===== 固定操作条 ===== */
#toolbar{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  display:flex;gap:6px;padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  background:var(--cream);border-top:2px dashed rgba(200,138,90,.35);
}
#toolbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--ink);padding:5px 2px;border-radius:14px;
}
#toolbar button svg{width:24px;height:24px;}
#toolbar button:active{background:#FDF1E0;}

/* ===== 弹层 ===== */
.sheet{
  position:absolute;inset:0;z-index:70;background:var(--cream);
  display:none;flex-direction:column;
}
.sheet.show{display:flex;}
.sheet header{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px dashed rgba(200,138,90,.35);
}
.sheet header h2{margin:0;font-size:17px;font-weight:500;}
.sheet .close{font-size:14px;color:var(--milk);padding:6px 10px;}
.sheet .body{flex:1;overflow-y:auto;padding:16px 14px 40px;-webkit-overflow-scrolling:touch;}
.btn{
  display:inline-block;padding:11px 20px;border-radius:999px;
  background:var(--caramel);color:#fff;font-size:15px;border:none;
}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--milk);}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}

/* 周报卡片 */
#weekCard{
  max-width:460px;margin:0 auto;padding:22px 20px;
  border:2px solid var(--milk);background:var(--paper);
  border-radius:24px 30px 26px 32px/30px 24px 32px 26px;
  animation:feed .7s cubic-bezier(.16,.9,.3,1) both;
}
#weekCard h3{margin:0 0 4px;font-size:20px;font-weight:500;}
#weekCard .sub{font-size:12px;color:var(--milk);margin-bottom:16px;}
.stat{display:flex;align-items:baseline;gap:6px;margin:6px 0;}
.stat .n{font-size:30px;font-weight:500;color:var(--caramel);line-height:1.2;}
.stat .u{font-size:13px;color:var(--milk);}
.sec{margin-top:18px;padding-top:14px;border-top:1.5px dashed rgba(200,138,90,.4);}
.sec h4{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--milk);}
.wall{display:flex;flex-wrap:wrap;gap:8px;}
.wall .f{
  width:74px;padding:6px 2px;text-align:center;background:#FDF1E0;
  border-radius:14px 18px 14px 18px/18px 14px 18px 14px;
}
.wall .f svg{width:46px;height:46px;}
.wall .f span{display:block;font-size:10.5px;color:var(--ink);line-height:1.3;margin-top:2px;}
.wall .f em{display:block;font-style:normal;font-size:10px;color:var(--caramel);}
.best{display:flex;align-items:center;gap:10px;}
.best svg{width:48px;height:48px;}
.best .t{font-size:16px;font-weight:500;}
.best .c{font-size:12px;color:var(--milk);}
.empty{font-size:13px;color:var(--milk);}

/* 历史记录 */
.daycard{
  display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;
  background:var(--paper);border:2px solid var(--milk);
  border-radius:18px 22px 18px 22px/22px 18px 22px 18px;
}
.daycard .thumb{
  width:56px;height:56px;flex:none;border-radius:14px;overflow:hidden;
  background:#FDF1E0;display:flex;align-items:center;justify-content:center;
}
.daycard .thumb img{width:100%;height:100%;object-fit:cover;}
.daycard .thumb svg{width:34px;height:34px;}
.daycard .info{flex:1;min-width:0;}
.daycard .d{font-size:15px;font-weight:500;}
.daycard .m{font-size:12px;color:var(--milk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.daycard svg.mood{width:38px;height:38px;flex:none;}

/* 抠图面板 */
#cutBody{display:flex;flex-direction:column;align-items:center;gap:12px;}
#cutCanvas{
  max-width:100%;border:2px solid var(--milk);border-radius:16px;
  touch-action:none;background:#FDF1E0;
}
.tip{font-size:13px;color:var(--milk);text-align:center;line-height:1.7;}

/* Toast */
#toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#FFF6E9;padding:10px 18px;border-radius:999px;
  font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.25s;
  max-width:80vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* 动作选择 */
#actionsheet{
  position:absolute;inset:0;z-index:80;background:rgba(91,66,52,.35);
  display:none;align-items:flex-end;
}
#actionsheet.show{display:flex;}
.as-box{
  width:100%;background:var(--paper);border-radius:24px 24px 0 0;padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
.as-box button{
  display:block;width:100%;text-align:center;padding:15px;font-size:16px;
  border-bottom:1px solid rgba(200,138,90,.25);
}
.as-box button:last-child{border-bottom:none;color:var(--milk);}
</style>
</head>
<body>

<!-- ===== 第 1 幕 开场页 ===== -->
<div id="intro">
  <div class="deco" id="introDeco"></div>
  <div class="type"><span id="typeText"></span><span class="caret" id="caret"></span></div>
  <div class="skiphint">点一下屏幕可以跳过</div>
</div>

<!-- ===== 第 2 幕 插画过渡 ===== -->
<div id="trans">
  <svg id="walker" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="176" rx="46" ry="6" fill="#F7D9A0" opacity=".7"/>
    <circle cx="100" cy="60" r="19" fill="#F7D9A0" stroke="#5B4234" stroke-width="2.6"/>
    <circle cx="93" cy="58" r="2.2" fill="#5B4234"/><circle cx="107" cy="58" r="2.2" fill="#5B4234"/>
    <path d="M94 66 Q100 72 106 66" fill="none" stroke="#5B4234" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="86" cy="66" r="3.4" fill="#F0997B" opacity=".65"/>
    <circle cx="114" cy="66" r="3.4" fill="#F0997B" opacity=".65"/>
    <path d="M100 79 L100 122" stroke="#5B4234" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M100 90 L80 100" stroke="#5B4234" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M100 90 L120 100" stroke="#5B4234" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M74 100 Q100 128 126 100 Z" fill="#FFFCF5" stroke="#5B4234" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M74 100 L126 100" stroke="#5B4234" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M83 106 Q100 118 117 106" fill="none" stroke="#E8A15D" stroke-width="2.4" stroke-linecap="round"/>
    <g class="steam"><path d="M92 92 Q87 84 92 76" fill="none" stroke="#C88A5A" stroke-width="2.2" stroke-linecap="round"/></g>
    <g class="steam" style="animation-delay:.5s"><path d="M108 92 Q113 84 108 76" fill="none" stroke="#C88A5A" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="legA"><path d="M100 122 L88 154" stroke="#5B4234" stroke-width="3.4" stroke-linecap="round"/></g>
    <g id="legB"><path d="M100 122 L112 154" stroke="#5B4234" stroke-width="3.4" stroke-linecap="round"/></g>
    <path d="M82 158 Q88 150 94 158" fill="none" stroke="#5B4234" stroke-width="3" stroke-linecap="round"/>
    <path d="M106 158 Q112 150 118 158" fill="none" stroke="#5B4234" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>

<!-- ===== 第 3 幕 主页面 ===== -->
<div id="app">
  <div id="topbar">
    <div>
      <div class="brand">吃饭日记</div>
      <div class="date" id="topDate"></div>
    </div>
    <button id="backToday">回到今天</button>
  </div>
  <div id="papers" class="paper-texture-wrap"></div>

  <div id="toolbar">
    <button data-act="camera"><span id="icCam"></span>拍照 / 相册</button>
    <button data-act="add"><span id="icAdd"></span>加一张纸</button>
    <button data-act="weekly"><span id="icChart"></span>生成周报</button>
    <button data-act="history"><span id="icHis"></span>历史记录</button>
    <button data-act="share"><span id="icShare"></span>分享</button>
  </div>
</div>

<!-- ===== 周报弹层 ===== -->
<div class="sheet" id="weekSheet">
  <header><h2>本周吃饭报告</h2><button class="close" data-close="weekSheet">关闭</button></header>
  <div class="body"><div id="weekCard"></div>
    <div class="btnrow">
      <button class="btn" id="weekShare">导出 / 分享长图</button>
    </div>
  </div>
</div>

<!-- ===== 历史记录弹层 ===== -->
<div class="sheet" id="hisSheet">
  <header><h2>历史记录</h2><button class="close" data-close="hisSheet">关闭</button></header>
  <div class="body" id="hisList"></div>
</div>

<!-- ===== 抠图弹层 ===== -->
<div class="sheet" id="cutSheet">
  <header><h2>给食物描个边</h2><button class="close" data-close="cutSheet">关闭</button></header>
  <div class="body">
    <div id="cutBody">
      <canvas id="cutCanvas"></canvas>
      <div class="tip">用手指沿着食物<b>画一圈</b>，松手自动闭合。<br>圈外会被挖空，边缘加上手绘描边，变成贴纸。</div>
      <div class="btnrow" style="width:100%">
        <button class="btn ghost" id="cutRedo">重新画</button>
        <button class="btn ghost" id="cutSkip">不用抠图</button>
        <button class="btn" id="cutDone">完成</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 动作选择 ===== -->
<div id="actionsheet">
  <div class="as-box">
    <button data-as="cam">拍照</button>
    <button data-as="lib">从相册选</button>
    <button data-as="cancel">取消</button>
  </div>
</div>

<div id="toast"></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fileLib" accept="image/*" style="display:none">

<script>
/* ==========================================================
   吃饭日记 · 单文件版
   数据：localStorage（刷新不丢）
   插画：全部内联 SVG 手绘，不联网
   ========================================================== */

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayKey(d){d=d||new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function prettyDate(k){const [y,m,d]=k.split('-');return `${+m}月${+d}日`; }
function weekdayOf(k){const w=['周日','周一','周二','周三','周四','周五','周六'];return w[new Date(k+'T00:00:00').getDay()];}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200);}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- 手绘插画库（内联 SVG） ---------- */
// 通用碗底
const BOWL = '<path d="M9 32 Q30 55 51 32 Z" fill="#FFFCF5" stroke="#5B4234" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 32 L51 32" stroke="#5B4234" stroke-width="2.2" stroke-linecap="round"/>';
function svg(inner,size){return `<svg xmlns="http://www.w3.org/2000/svg" width="${size||60}" height="${size||60}" viewBox="0 0 60 60">${inner}</svg>`;}

// 食物插画：key -> SVG（60x60）
const ART = {
  '米饭': BOWL+'<path d="M14 31 Q30 14 46 31 Z" fill="#FFFCF5" stroke="#5B4234" stroke-width="2"/><circle cx="24" cy="26" r="1.6" fill="#E8A15D"/><circle cx="34" cy="24" r="1.6" fill="#E8A15D"/>',
  '粥':   BOWL+'<path d="M15 31 Q30 20 45 31 Z" fill="#F7D9A0" stroke="#5B4234" stroke-width="1.8"/><circle cx="26" cy="27" r="1.4" fill="#FFFCF5"/><circle cx="35" cy="28" r="1.4" fill="#FFFCF5"/>',
  '面条': BOWL+'<path d="M16 30 Q22 22 28 30 T40 30 T50 30" fill="none" stroke="#E8A15D" stroke-width="2.2" stroke-linecap="round"/><path d="M15 34 Q22 27 29 34 T43 34" fill="none" stroke="#C88A5A" stroke-width="2" stroke-linecap="round"/>',
  '米线': BOWL+'<path d="M15 31 Q30 22 45 31" fill="none" stroke="#E8A15D" stroke-width="2.2" stroke-linecap="round"/><path d="M17 35 Q30 28 43 35" fill="none" stroke="#C88A5A" stroke-width="2" stroke-linecap="round"/>',

// 按名字反查插画 key（优先长的匹配）
function artKeyOf(name){
  if(!name) return null;
  const n = String(name).trim();
  const keys = Object.keys(ART);
  let best=null;
  for(const k of keys){ if(n.indexOf(k)>=0 && (!best || k.length>best.length)) best=k; }
  return best;
}
function artOf(name,size){ const k=artKeyOf(name); return svg(k?ART[k]:DEFAULT_ART,size||60); }
// 卡路里估算：名字里命中最长的那个词
function kcalOf(name){
  if(!name) return null;
  const n = String(name).trim();
  let best=null,bestLen=0;
  for(const k in KCAL){ if(n.indexOf(k)>=0 && k.length>bestLen){ best=k; bestLen=k.length; } }
  return best? KCAL[best] : null;
}

const STORE='chifan-riji-v1';

function load(){
  try{ const raw=localStorage.getItem(STORE); if(raw) return JSON.parse(raw); }catch(e){}

}
let saveTimer;
function save(){
  clearTimeout(saveTimer);

    catch(e){

function handleFile(file){
  if(!file||!pendingPhotoId) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      // 压缩：最长边 800，JPEG 0.72，避免 localStorage 爆掉
      const max=800, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const cx=c.getContext('2d');
      cx.fillStyle='#FFFCF5'; cx.fillRect(0,0,c.width,c.height);
      cx.drawImage(img,0,0,c.width,c.height);
      const day=getDay(currentKey);
      const p=day.pages.find(x=>x.id===pendingPhotoId);
      if(p){ p.photo=c.toDataURL('image/jpeg',0.72); }
      pendingPhotoId=null;
      renderPapers(); save();
      toast('照片放好啦，可以点「抠图描边」');
    };
    img.onerror=()=>toast('这张图片打不开');
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ==========================================================
   抠图 + 描边（手动画轮廓，纯前端真实现）
   ========================================================== */
const cutCanvas=$('#cutCanvas'), cutCtx=cutCanvas.getContext('2d');
let cutPage=null, cutImg=null, cutPts=[], cutDrawing=false, cutBox={x:0,y:0,w:0,h:0};
function openCutter(p){
  if(!p.photo){ toast('先上传一张照片'); return; }
  cutPage=p; cutPts=[];
  const img=new Image();
  img.onload=()=>{
    cutImg=img;
    const availW=Math.min(window.innerWidth-40,460);
    const s=availW/img.width;
    const dispW=Math.round(img.width*s), dispH=Math.round(img.height*s);
    const maxH=window.innerHeight-260;
    const s2=maxH>0&&dispH>maxH? maxH/dispH : 1;
    cutCanvas.style.width=(dispW*s2)+'px';
    cutCanvas.style.height=(dispH*s2)+'px';
    const dpr=Math.min(2,window.devicePixelRatio||1);
    cutCanvas.width=Math.round(dispW*s2*dpr); cutCanvas.height=Math.round(dispH*s2*dpr);
    cutCtx.setTransform(dpr,0,0,dpr,0,0);
    cutBox={w:dispW*s2,h:dispH*s2};
    drawCut();
    $('#cutSheet').classList.add('show');
  };
  img.src=p.photo;
}
function drawCut(){
  if(!cutImg) return;
  cutCtx.clearRect(0,0,cutBox.w,cutBox.h);
  cutCtx.drawImage(cutImg,0,0,cutBox.w,cutBox.h);
  // 已画的轮廓
  if(cutPts.length>1){
    cutCtx.save();
    cutCtx.beginPath();
    cutPts.forEach((pt,i)=> i?cutCtx.lineTo(pt.x,pt.y):cutCtx.moveTo(pt.x,pt.y));
    cutCtx.strokeStyle='#E8A15D'; cutCtx.lineWidth=3; cutCtx.lineJoin='round'; cutCtx.lineCap='round';
    cutCtx.setLineDash([7,5]); cutCtx.stroke();
    cutCtx.restore();
  }
}
function cutPos(ev){
  const r=cutCanvas.getBoundingClientRect();
  const t=ev.touches?ev.touches[0]:ev;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
cutCanvas.addEventListener('pointerdown',e=>{ cutDrawing=true; cutPts=[cutPos(e)]; cutCanvas.setPointerCapture(e.pointerId); drawCut(); });
cutCanvas.addEventListener('pointermove',e=>{ if(!cutDrawing) return; cutPts.push(cutPos(e)); drawCut(); });
cutCanvas.addEventListener('pointerup',e=>{ if(!cutDrawing) return; cutDrawing=false; drawCut(); });
cutCanvas.addEventListener('pointercancel',()=>{cutDrawing=false;});
$('#cutRedo').addEventListener('click',()=>{ cutPts=[]; drawCut(); });
$('#cutSkip').addEventListener('click',()=>{
  if(cutPage){ cutPage.sticker=''; }
  $('#cutSheet').classList.remove('show'); renderPapers(); save(); toast('保留原图，加个手绘相框');
});
$('#cutDone').addEventListener('click',()=>{
  if(!cutPage||!cutImg) return;
  if(cutPts.length<8){ toast('沿着食物画一圈再点完成'); return; }
  // 输出画布：最长边 640
  const s=Math.min(1,640/Math.max(cutImg.width,cutImg.height));
  const outW=Math.round(cutImg.width*s), outH=Math.round(cutImg.height*s);
  const oc=document.createElement('canvas'); oc.width=outW; oc.height=outH;
  const o=oc.getContext('2d');
  // 显示坐标 -> 输出坐标
  const k=outW/cutBox.w;
  const path=new Path2D();
  cutPts.forEach((pt,i)=>{ const x=pt.x*k, y=pt.y*k; i?path.lineTo(x,y):path.moveTo(x,y); });
  path.closePath();
  // 1) 圈内画原图，圈外透明
  o.save(); o.clip(path); o.drawImage(cutImg,0,0,outW,outH); o.restore();
  // 2) 手绘描边：先粗白边，再深棕细线
  o.lineJoin='round'; o.lineCap='round';
  o.strokeStyle='#FFFCF5'; o.lineWidth=Math.max(8,14*(outW/640)*1.6); o.stroke(path);
  o.strokeStyle='#5B4234'; o.lineWidth=Math.max(3,5*(outW/640)*1.6); o.stroke(path);
  cutPage.sticker=oc.toDataURL('image/png');
  $('#cutSheet').classList.remove('show');
  renderPapers(); save(); toast('贴纸做好啦');
});

/* ==========================================================
   周报
   ========================================================== */
const WEEK_TARGET=10500; // 参考值：约 1500 kcal/天，仅用于画圆环比例
function collectWeek(){
  const days=[];
  const base=new Date(currentKey+'T00:00:00');
  for(let i=6;i>=0;i--){
    const d=new Date(base); d.setDate(d.getDate()-i);
    const k=todayKey(d);
    if(DB.days[k]) days.push({k, day:DB.days[k]});
  }
  const foodMap={}; // name -> count
  let totalKcal=0, hasKcal=false;
  const moodSeries=[];
  days.forEach(({k,day})=>{
    let dayKcal=0, mood=null;
    (day.pages||[]).forEach(p=>{
      if(p.kind==='info'){
        if(p.food && p.food.trim()){ const n=p.food.trim(); foodMap[n]=(foodMap[n]||0)+1; }
        if(p.kcal!==''&&p.kcal!=null&&!isNaN(+p.kcal)){ dayKcal+=+p.kcal; hasKcal=true; }
        if(typeof p.mood==='number') mood=p.mood;
      }
    });
    totalKcal+=dayKcal;
    moodSeries.push({k, mood});
  });
  const foods=Object.keys(foodMap).map(n=>({name:n,count:foodMap[n]})).sort((a,b)=>b.count-a.count);
  const best=foods[0]||null;
  return {days,foods,totalKcal,hasKcal,best,moodSeries};
}
function ringSVG(ratio){
  const R=42, C=2*Math.PI*R, on=Math.max(0,Math.min(1,ratio))*C;
  return `<svg viewBox="0 0 100 100" width="120" height="120">
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="#FDF1E0" stroke-width="12"/>
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="#E8A15D" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${(C-on).toFixed(1)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="47" text-anchor="middle" font-size="17" fill="#E8A15D" font-family="sans-serif">${Math.round(ratio*100)}%</text>
    <text x="50" y="63" text-anchor="middle" font-size="10" fill="#C88A5A" font-family="sans-serif">周目标</text>
  </svg>`;
}
function moodLineSVG(series){
  if(!series.length) return '';
  const W=300,H=70,pad=18;
  const step=series.length>1?(W-pad*2)/(series.length-1):0;
  const pts=series.map((s,i)=>({
    x:pad+i*step,
    y: H-pad - (s.mood==null?2:(s.mood/4))*(H-pad*2-8)
  }));
  let d='';
  pts.forEach((p,i)=>{ d += (i?' L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); });
  const dots=pts.map((p,i)=>{
    const m=series[i].mood;
    return m==null? '' : `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#F7D9A0" stroke="#5B4234" stroke-width="2"/>`;
  }).join('');
  const labels=series.map((s,i)=>`<text x="${pts[i].x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="9" fill="#C88A5A" font-family="sans-serif">${s.k.slice(5).replace('-','/')}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="90" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="#E8A15D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
let weekData=null;
function openWeekly(autoShare){
  weekData=collectWeek();
  const w=weekData;
  const wall = w.foods.length
    ? `<div class="wall">${w.foods.slice(0,12).map(f=>`<div class="f">${artOf(f.name,46)}<span>${esc(f.name)}</span><em>×${f.count}</em></div>`).join('')}</div>`
    : `<div class="empty">这一周还没有记录食物，先去第一张纸写点什么吧。</div>`;
  const bestHTML = w.best
    ? `<div class="best">${artOf(w.best.name,48)}<div><div class="t">${esc(w.best.name)}</div><div class="c">本周吃了 ${w.best.count} 次 · 本周最佳</div></div></div>`
    : `<div class="empty">还没有足够的记录。</div>`;
  const kcalHTML = w.hasKcal
    ? `<div style="display:flex;align-items:center;gap:14px">
         ${ringSVG(w.totalKcal/WEEK_TARGET)}
         <div><div class="stat"><span class="n">${w.totalKcal}</span><span class="u">kcal</span></div>
         <div class="empty">按每天约 1500 kcal 作为参考</div></div>
       </div>`
    : `<div class="empty">还没填卡路里，写上食物名会自动估算。</div>`;
  const range = w.days.length? `${w.days[0].k.replace(/-/g,'/')} – ${w.days[w.days.length-1].k.replace(/-/g,'/')}` : '最近 7 天';
  $('#weekCard').innerHTML=`
    <h3>本周吃饭报告</h3>
    <div class="sub">${range} · 共记录 ${w.days.length} 天</div>
    <div class="sec"><h4>这周吃了 ${w.foods.length} 种食物</h4>${wall}</div>
    <div class="sec"><h4>卡路里</h4>${kcalHTML}</div>
    <div class="sec"><h4>本周最佳</h4>${bestHTML}</div>
    <div class="sec"><h4>一周心情</h4>${w.moodSeries.length?moodLineSVG(w.moodSeries):'<div class="empty">还没有心情记录。</div>'}</div>
    <div class="sec" style="text-align:center;border-top:none"><div class="empty">生活会奖励每一个大口吃饭的人</div></div>`;
  $('#weekSheet').classList.add('show');
  if(autoShare) setTimeout(()=>shareReport(),700);
}
$('#weekShare').addEventListener('click',()=>shareReport());

/* ==========================================================
   分享：canvas 竖版长图 + navigator.share
   ========================================================== */
function svgToImage(s,size){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('svg fail'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  });
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
async function drawReportCanvas(){
  const w=weekData||collectWeek();
  const C={
    cream:'#FFF6E9', paper:'#FFFCF5', ink:'#5B4234', milk:'#C88A5A',
    caramel:'#E8A15D', butter:'#F7D9A0', matcha:'#9CBF8A'
  };
  const W=750, pad=54;
  const showFoods=w.foods.slice(0,12);
  const perRow=3, rows=Math.ceil(showFoods.length/perRow);
  const wallH = rows? rows*150 : 60;
  const H = 300 + wallH + 300 + 200 + 230 + 120;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle=C.cream; c.fillRect(0,0,W,H);
  // 卡片底
  c.fillStyle=C.paper; c.strokeStyle=C.milk; c.lineWidth=4;
  roundRect(c,pad*0.5,pad*0.5,W-pad,H-pad,34); c.fill(); c.stroke();

  let y=pad+40;
  c.fillStyle=C.ink; c.font='500 40px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign='center'; c.fillText('本周吃饭报告',W/2,y); y+=40;
  c.fillStyle=C.milk; c.font='400 20px "PingFang SC",sans-serif';
  const range = w.days.length? `${w.days[0].k.replace(/-/g,'/')} – ${w.days[w.days.length-1].k.replace(/-/g,'/')} · 共 ${w.days.length} 天` : '最近 7 天';
  c.fillText(range,W/2,y); y+=34;

  // 分隔
  function sep(yy){ c.strokeStyle=C.milk; c.lineWidth=2; c.setLineDash([8,8]); c.beginPath(); c.moveTo(pad+16,yy); c.lineTo(W-pad-16,yy); c.stroke(); c.setLineDash([]); }
  sep(y); y+=42;

  // 食物墙
  c.textAlign='left'; c.fillStyle=C.milk; c.font='400 22px "PingFang SC",sans-serif';
  c.fillText(`这周吃了 ${w.foods.length} 种食物`,pad+16,y); y+=24;
  if(showFoods.length){
    const cellW=(W-pad*2-32)/perRow;
    for(let i=0;i<showFoods.length;i++){
      const r=Math.floor(i/perRow), col=i%perRow;
      const cx=pad+16+col*cellW+cellW/2, cy=y+r*150+52;
      try{
        const im=await svgToImage(artOf(showFoods[i].name,100),100);
        c.drawImage(im,cx-46,cy-46,92,92);
      }catch(e){}
      c.textAlign='center'; c.fillStyle=C.ink; c.font='400 19px "PingFang SC",sans-serif';
      const nm=showFoods[i].name.length>5?showFoods[i].name.slice(0,5)+'…':showFoods[i].name;
      c.fillText(nm,cx,cy+66);
      c.fillStyle=C.caramel; c.font='400 16px "PingFang SC",sans-serif';
      c.fillText('×'+showFoods[i].count,cx,cy+90);
    }
    y+=rows*150+10;
  }else{
    c.textAlign='center'; c.fillStyle=C.milk; c.font='400 20px "PingFang SC",sans-serif';
    c.fillText('这一周还没有记录食物',W/2,y+30); y+=60;
  }

  // 卡路里圆环
  sep(y); y+=46;
  c.textAlign='left'; c.fillStyle=C.milk; c.font='400 22px "PingFang SC",sans-serif';
  c.fillText('卡路里',pad+16,y); y+=20;
  const cx0=pad+90, cy0=y+70, R=52;
  c.strokeStyle=C.butter; c.lineWidth=14; c.beginPath(); c.arc(cx0,cy0,R,0,Math.PI*2); c.stroke();
  const ratio=Math.max(0,Math.min(1,w.totalKcal/WEEK_TARGET));
  c.strokeStyle=C.caramel; c.lineWidth=14; c.lineCap='round';
  c.beginPath(); c.arc(cx0,cy0,R,-Math.PI/2,-Math.PI/2+ratio*Math.PI*2); c.stroke();
  c.textAlign='center'; c.fillStyle=C.caramel; c.font='500 30px "PingFang SC",sans-serif';
  c.fillText(Math.round(ratio*100)+'%',cx0,cy0+8);
  c.fillStyle=C.ink; c.font='500 42px "PingFang SC",sans-serif'; c.textAlign='left';
  c.fillText(String(w.totalKcal),cx0+R+34,cy0+4);
  c.fillStyle=C.milk; c.font='400 20px "PingFang SC",sans-serif';
  c.fillText('kcal',cx0+R+34+ (String(w.totalKcal).length*26) +8,cy0+4);
  c.fillStyle=C.milk; c.font='400 17px "PingFang SC",sans-serif';
  c.fillText('按每天约 1500 kcal 作为参考',cx0+R+34,cy0+36);
  y+=160;

  // 本周最佳
  sep(y); y+=46;
  c.fillStyle=C.milk; c.font='400 22px "PingFang SC",sans-serif'; c.textAlign='left';
  c.fillText('本周最佳',pad+16,y); y+=34;
  if(w.best){
    try{
      const im=await svgToImage(artOf(w.best.name,100),100);
      c.drawImage(im,pad+16,y-10,84,84);
    }catch(e){}
    c.fillStyle=C.ink; c.font='500 30px "PingFang SC",sans-serif';
    c.fillText(w.best.name,pad+116,y+34);
    c.fillStyle=C.milk; c.font='400 19px "PingFang SC",sans-serif';
    c.fillText(`本周吃了 ${w.best.count} 次`,pad+116,y+66);
  }else{
    c.fillStyle=C.milk; c.font='400 20px "PingFang SC",sans-serif';
    c.fillText('还没有足够的记录',pad+16,y+24);
  }
  y+=120;

  // 心情折线
  sep(y); y+=46;
  c.fillStyle=C.milk; c.font='400 22px "PingFang SC",sans-serif';
  c.fillText('一周心情',pad+16,y); y+=24;
  if(w.moodSeries.length){
    const x0=pad+30, x1=W-pad-30, yBase=y+90, hh=70;
    const n=w.moodSeries.length, step=n>1?(x1-x0)/(n-1):0;
    // 底线
    c.strokeStyle=C.butter; c.lineWidth=3; c.setLineDash([6,6]);
    c.beginPath(); c.moveTo(x0,yBase); c.lineTo(x1,yBase); c.stroke(); c.setLineDash([]);
    const pts=w.moodSeries.map((s,i)=>({x:x0+i*step, y: yBase-(s.mood==null?0:(s.mood/4))*hh}));
    c.strokeStyle=C.caramel; c.lineWidth=4; c.lineJoin='round'; c.lineCap='round';
    c.beginPath(); pts.forEach((p,i)=> i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.stroke();
    pts.forEach((p,i)=>{
      if(w.moodSeries[i].mood==null) return;
      c.fillStyle=C.butter; c.beginPath(); c.arc(p.x,p.y,7,0,Math.PI*2); c.fill();
      c.strokeStyle=C.ink; c.lineWidth=2.5; c.stroke();
    });
    c.fillStyle=C.milk; c.font='400 15px "PingFang SC",sans-serif'; c.textAlign='center';
    w.moodSeries.forEach((s,i)=>{ c.fillText(s.k.slice(5).replace('-','/'),pts[i].x,yBase+26); });
    y+=130;
  }else{ y+=40; }

  // 落款
  c.textAlign='center'; c.fillStyle=C.milk; c.font='400 21px "PingFang SC",sans-serif';
  c.fillText('生活会奖励每一个大口吃饭的人',W/2,H-pad-40);
  return cv;
}
async function shareReport(){
  toast('正在生成长图…');
  try{
    const cv=await drawReportCanvas();
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const file=new File([blob],'吃饭周报.png',{type:'image/png'});
    // 1) 尝试系统分享（支持带图的话）
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'本周吃饭报告',text:'生活会奖励每一个大口吃饭的人'}); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }else if(navigator.share){
      try{ await navigator.share({title:'本周吃饭报告',text:'生活会奖励每一个大口吃饭的人'}); }catch(e){}
    }
    // 2) 兜底：直接下载
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='吃饭周报.png'; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    toast('长图已保存到本地');
  }catch(err){
    toast('生成失败：'+(err&&err.message?err.message:'未知错误'));
  }
}

/* ==========================================================
   历史记录
   ========================================================== */
function openHistory(){
  const keys=Object.keys(DB.days).sort().reverse();
  if(!keys.length){ $('#hisList').innerHTML='<div class="empty" style="text-align:center;padding:40px">还没有任何记录。</div>'; $('#hisSheet').classList.add('show'); return; }
  $('#hisList').innerHTML=keys.map(k=>{
    const day=DB.days[k];
    const info=(day.pages||[]).find(p=>p.kind==='info')||{};
    const photo=(day.pages||[]).find(p=>p.kind==='photo')||{};
    const thumb = (photo.sticker||photo.photo)
      ? `<img src="${photo.sticker||photo.photo}" alt="">`
      : artOf(info.food||'',34);
    const mood = (typeof info.mood==='number')? MOODS[info.mood].svg : '';
    const foodTxt = info.food? esc(info.food) : '还没写吃什么';
    const kcalTxt = (info.kcal!==''&&info.kcal!=null)? ` · ${info.kcal} kcal` : '';
    return `<div class="daycard" data-k="${k}">
      <div class="thumb">${thumb}</div>
      <div class="info"><div class="d">${prettyDate(k)} · ${weekdayOf(k)}</div><div class="m">${foodTxt}${kcalTxt}</div></div>
      ${mood?`<svg class="mood" viewBox="0 0 40 40">${mood.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg>`:''}
    </div>`;
  }).join('');
  $('#hisSheet').classList.add('show');
}
$('#hisList').addEventListener('click',e=>{
  const card=e.target.closest('.daycard'); if(!card) return;
  currentKey=card.dataset.k;
  $('#hisSheet').classList.remove('show');
  renderAll(true);
  toast('可以回看，也能继续改');
});

getDay(todayKey());
renderAll(true);
runIntro();
